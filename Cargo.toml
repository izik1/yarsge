[workspace]
members = ["yarsge-core", "yarsge-dsp", "yarsge-math", "yarsge-sdl"]
resolver = "3"

[workspace.package]
authors = ["Skyler Ross <orangesnowfox@gmail.com>"]
edition = "2024"
version = "0.1.0"


[workspace.dependencies.yarsge-core]
path = "yarsge-core"

[workspace.dependencies.yarsge-math]
path = "yarsge-math"

[workspace.dependencies.yarsge-dsp]
path = "yarsge-dsp"


[profile.dev.package.yarsge-core]
opt-level = 1

[profile.profile]
debug = "full"
inherits = "release"
